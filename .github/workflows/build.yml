name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21", "1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build Nice Client for ${{ matrix.mc }}
        run: |
          chmod +x gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NiceClient-${{ matrix.mc }}
          path: build/libs/niceclient-*+mc${{ matrix.mc }}.jar
